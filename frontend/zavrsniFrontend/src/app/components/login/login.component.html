<div class="login-container">
  <div class="login-card">
    <h3 class="text-center mb-4">Login</h3>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" formControlName="email" id="email" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" formControlName="password" id="password" placeholder="Enter your password">
      </div>

      <button type="submit" class="btn-primary full-width" [disabled]="loginForm.invalid">Login</button>
    </form>

    <hr class="divider" />

    <button class="btn-outline full-width" (click)="loginWithGoogle()">
      <i class="fa-brands fa-google"></i> Login with Google
    </button>


    <a routerLink="/register" class="btn-link full-width mt-3">Don't have an account? Register</a>

  </div>
</div>
