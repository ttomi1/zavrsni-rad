<div *ngIf="user" class="container mt-4">
  <div class="card p-4 shadow-sm text-center profile-card">
    <img [src]="user.imageUrl | fullImageUrl"
         alt="{{ user.userName }}"
         class="rounded-circle mb-3 profile-image"
         width="120" height="120">

    <h3>{{ user.userName }}</h3>
    <p><strong>Name:</strong> {{ user.firstName }} {{ user.lastName }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>

    <div class="d-flex justify-content-center gap-4 mt-3">
      <span><strong>{{ stats?.followers || 0 }}</strong> Followers</span>
      <span><strong>{{ stats?.following || 0 }}</strong> Following</span>
    </div>

    <button *ngIf="!isOwnProfile"
            class="btn btn-primary mt-3"
            (click)="toggleFollow()">
      {{ isFollowing ? 'Unfollow' : 'Follow' }}
    </button>
  </div>
</div>

<app-post-list></app-post-list>
